name: Mobile Automation Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Appium
        run: |
          npm install -g appium@3.7.0
          appium --version

      - name: Install UiAutomator2 driver
        run: |
          appium driver install uiautomator2
          appium driver list --installed

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "emulator"
          sdkmanager "system-images;android-35;google_apis;x86_64"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Create Android emulator
        run: |
          echo "no" | avdmanager create avd \
            --name ci-emulator \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

      - name: Install Emulator Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Start Android Emulator
        run: |
          set -e

          export PATH="$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Starting Android emulator..."

          which emulator
          emulator -version

          nohup emulator \
            -avd appium-android-34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"

          adb start-server

          echo "Waiting for emulator process..."

          for i in {1..60}; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator process exited!"
              echo "===== emulator.log ====="
              cat emulator.log
              exit 1
            fi

            echo "Emulator process is running... $i/60"
            sleep 2
          done

          echo "===== ADB devices ====="
          adb devices

          echo "===== Emulator log ====="
          cat emulator.log

          echo "Waiting for Android boot..."

          timeout 180 bash -c '
            until adb shell getprop sys.boot_completed 2>/dev/null | grep -m 1 "1"; do
              echo "Android is still booting..."
              sleep 5
            done
          '

          echo "Android emulator boot completed!"
          adb devices
      - name: Verify Android emulator
        run: |
          adb devices
          adb shell getprop ro.build.version.sdk

      - name: Run tests
        run: |
          pytest --env local