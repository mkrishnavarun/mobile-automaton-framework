name: Mobile Automation Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Appium
        run: |
          npm install -g appium@3.7.0
          appium --version

      - name: Install UiAutomator2 driver
        run: |
          appium driver install uiautomator2
          appium driver list --installed

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "emulator"
          sdkmanager "system-images;android-35;google_apis;x86_64"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Create Android emulator
        run: |
          echo "no" | avdmanager create avd \
            --name ci-emulator \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

      - name: Start Android emulator
        run: |
          set -e
          
          echo "Starting Android emulator..."
          
          nohup emulator \
            -avd ci-emulator \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &
          
          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"
          
          echo "Waiting for ADB device..."
          
          for i in {1..60}; do
            if adb devices | grep -q "emulator-"; then
              echo "Emulator detected by ADB"
              break
            fi
          
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator process exited unexpectedly"
              cat emulator.log
              exit 1
            fi
          
            echo "Waiting for emulator... $i/60"
            sleep 2
          done
          
          if ! adb devices | grep -q "emulator-"; then
            echo "ERROR: Emulator did not appear in ADB"
            cat emulator.log
            exit 1
          fi
          
          echo "Waiting for Android boot to complete..."
          
          for i in {1..90}; do
            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          
            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Android boot completed"
              break
            fi
          
            echo "Android still booting... $i/90"
            sleep 2
          done
          
          BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          
          if [ "$BOOT_COMPLETED" != "1" ]; then
            echo "ERROR: Android emulator failed to boot"
            echo "===== Emulator log ====="
            cat emulator.log
            echo "===== ADB devices ====="
            adb devices
            exit 1
          fi
          
          adb shell input keyevent 82
          
          echo "Android emulator is ready!"
      - name: Verify Android emulator
        run: |
          adb devices
          adb shell getprop ro.build.version.sdk

      - name: Run tests
        run: |
          pytest --env local